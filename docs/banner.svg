<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Shelfspace</title>
  <desc id="desc">Shelfspace: your books, beautifully read. A cozy library with a 3D page-turning reader.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f523f"/>
      <stop offset="1" stop-color="#2f3e30"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c98a64"/><stop offset=".8" stop-color="#9c5440"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cdb487"/><stop offset=".8" stop-color="#9c8457"/></linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a9476"/><stop offset=".8" stop-color="#405a45"/></linearGradient>
    <linearGradient id="midnight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#667888"/><stop offset=".8" stop-color="#304b58"/></linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fffdf7"/><stop offset=".9" stop-color="#f6f1e5"/><stop offset="1" stop-color="#e3dbc8"/></linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fffdf7"/><stop offset=".9" stop-color="#f6f1e5"/><stop offset="1" stop-color="#e3dbc8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="6" dy="14" stdDeviation="12" flood-color="#141a14" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="400" rx="18" fill="url(#bg)"/>
  <circle cx="120" cy="420" r="300" fill="none" stroke="#d9dfc6" stroke-opacity=".08"/>
  <circle cx="1180" cy="-40" r="360" fill="none" stroke="#d9dfc6" stroke-opacity=".08"/>

  <g transform="translate(88 92)">
    <rect width="54" height="54" rx="13" fill="#eee9dc"/>
    <text x="27" y="40" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="36" font-style="italic" font-weight="600" fill="#3a4b3b">S</text>
    <text x="72" y="39" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#f5f0e5">Shelfspace</text>
  </g>
  <text x="88" y="222" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="58" font-weight="500" fill="#f5f0e5" letter-spacing="-1.5">Your books,</text>
  <text x="88" y="290" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="58" font-weight="500" letter-spacing="-1.5"><tspan fill="#d4bd8f" font-style="italic">beautifully</tspan><tspan fill="#f5f0e5"> read.</tspan></text>
  <text x="90" y="336" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#c1c7b7" letter-spacing=".6">A cozy library · 3D page-turning reader · admin-approved community shelf</text>

  <!-- A small shelf of books -->
  <g filter="url(#shadow)">
    <g transform="translate(690 122) rotate(-7)">
      <rect width="104" height="150" rx="5" fill="url(#terracotta)"/>
      <rect x="8" y="8" width="88" height="134" rx="2" fill="none" stroke="#fff7e4" stroke-opacity=".35"/>
      <text x="52" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#fff9ee">SMALL</text>
      <text x="52" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#fff9ee">WONDERS</text>
    </g>
    <g transform="translate(806 110) rotate(3)">
      <rect width="104" height="150" rx="5" fill="url(#midnight)"/>
      <rect x="8" y="8" width="88" height="134" rx="2" fill="none" stroke="#fff7e4" stroke-opacity=".35"/>
      <text x="52" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#fff9ee">GARDENS</text>
      <text x="52" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#fff9ee">AT NIGHT</text>
    </g>
  </g>

  <!-- An open book, mid page-turn -->
  <g filter="url(#shadow)" transform="translate(880 196)">
    <path d="M0 8 L150 0 L150 168 L0 176 Z" fill="url(#page)"/>
    <path d="M150 0 L300 8 L300 176 L150 168 Z" fill="url(#pageR)"/>
    <path d="M150 0 L238 -26 L238 142 L150 168 Z" fill="#f3ecdc"/>
    <path d="M150 0 L238 -26 L238 142 L150 168 Z" fill="#2c281d" fill-opacity=".08"/>
    <g stroke="#b7ae98" stroke-width="3" stroke-linecap="round">
      <path d="M22 44 H128 M22 60 H120 M22 76 H128 M22 92 H110 M22 108 H126 M22 124 H96"/>
      <path d="M172 52 H278 M172 68 H270 M172 84 H278 M172 100 H262 M172 116 H276 M172 132 H240" stroke-opacity=".7"/>
    </g>
    <text x="40" y="34" font-family="Georgia, serif" font-size="11" fill="#536b52" letter-spacing="1">CHAPTER ONE</text>
    <rect x="148" y="0" width="4" height="170" fill="#6e675a" fill-opacity=".25"/>
  </g>
  <g fill="#d4bd8f" font-family="Georgia, serif" font-size="22">
    <text x="1170" y="150">✳</text>
  </g>
</svg>
